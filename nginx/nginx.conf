user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # 1. User Application (Public Frontend)
    server {
        listen 80;
        server_name soulverse.im app.soulverse.im;

        location / {
            proxy_pass http://soulverse-user-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. User API (Public REST & WebSockets)
    server {
        listen 80;
        server_name api.soulverse.im;

        location / {
            proxy_pass http://soulverse-user-api:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. Dedicated Admin Frontend (admin.soulverse.im)
    server {
        listen 80;
        server_name admin.soulverse.im;

        # Internal Network / VPN / IP Allowlist restriction block (optional in production)
        # allow 10.0.0.0/8;
        # deny all;

        location / {
            proxy_pass http://soulverse-admin-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 4. Dedicated Admin API (admin-api.soulverse.im)
    server {
        listen 80;
        server_name admin-api.soulverse.im;

        location / {
            proxy_pass http://soulverse-admin-api:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
